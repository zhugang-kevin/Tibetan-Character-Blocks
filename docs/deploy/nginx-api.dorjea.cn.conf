# /etc/nginx/conf.d/api.dorjea.cn.conf
#
# 藏趣方块 · API 服务（唯一正确版本，2026-11-11 按实际证书+端口重写）
# 域名：api.dorjea.cn（子域名，微信小程序不支持父域名 dorjea.cn）
# 后端：127.0.0.1:8300（生产端口，见 /etc/dorjea/env 的 PORT=8300）
# 证书：腾讯云签发的 DV 证书（TrustAsia），文件名 api.dorjea.cn_bundle.crt / api.dorjea.cn.key

# ─── HTTP：全量跳 HTTPS ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.dorjea.cn;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ─── HTTPS 主站 ──────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.dorjea.cn;

    # 🔴 证书：把你下载的 nginx 包里的两个文件上传到服务器后，路径对应这里
    #   api.dorjea.cn_bundle.crt  →  /etc/nginx/ssl/api.dorjea.cn_bundle.crt
    #   api.dorjea.cn.key         →  /etc/nginx/ssl/api.dorjea.cn.key
    ssl_certificate     /etc/nginx/ssl/api.dorjea.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/api.dorjea.cn.key;

    # 微信要求 TLS ≥ 1.2
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 上传体积上限
    client_max_body_size 8m;

    access_log /var/log/nginx/api.dorjea.cn.access.log;
    error_log  /var/log/nginx/api.dorjea.cn.error.log;

    # ─── 反代到 Node 服务（8300）───────────────────
    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ─── 不要暴露敏感文件 ─────────────────────────────
    location ~ /\.(git|env|db) {
        deny all;
        return 404;
    }
}

# ─── 根域 / www：只做跳转 ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dorjea.cn www.dorjea.cn;
    return 301 https://api.dorjea.cn$request_uri;
}
