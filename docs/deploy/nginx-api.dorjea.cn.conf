# /etc/nginx/conf.d/api.dorjea.cn.conf
#
# 藏趣方块 · API 服务
# 域名：api.dorjea.cn（子域名，微信小程序不支持父域名 dorjea.cn）
#
# 部署步骤见 docs/deploy/README.md

# ─── HTTP：全量跳 HTTPS ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.dorjea.cn;

    # 阿里云/Let's Encrypt 证书验证路径要放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ─── HTTPS 主站 ──────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.dorjea.cn;

    # 证书（阿里云免费 DV 证书下载后放这里，或 certbot 自动生成）
    ssl_certificate     /etc/nginx/ssl/api.dorjea.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/api.dorjea.cn.key;

    # 微信要求 TLS ≥ 1.2，只开 1.2 / 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 上传体积上限（礼物凭证、截图等）
    client_max_body_size 8m;

    # 日志
    access_log /var/log/nginx/api.dorjea.cn.access.log;
    error_log  /var/log/nginx/api.dorjea.cn.error.log;

    # ─── 反代到 Node 服务 ───────────────────────────
    # 项目内 server/index.js 监听 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 微信支付回调可能较慢，超时放宽
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # WebSocket（若将来需要）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── 健康检查（不进 Node，直接回 200）───────────
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ─── 不要暴露的文件 ─────────────────────────────
    location ~ /\.(git|env|db) {
        deny all;
        return 404;
    }
}

# ─── 根域 / www：只做跳转（H5 落地用）─────────────
# 注意：小程序服务器域名不能填这个，只能用 api.dorjea.cn
server {
    listen 80;
    listen [::]:80;
    server_name dorjea.cn www.dorjea.cn;
    return 301 https://api.dorjea.cn$request_uri;
}
