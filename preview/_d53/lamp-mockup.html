<!doctype html><meta charset="utf-8"><title>D53 灯火跳窗改版样张</title>
<style>
body{margin:0;background:#100d16;color:#E8D9A8;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:18px}
.wrap{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.ctrl{width:230px}
.ctrl h3{font-size:13px;color:#FFD98A;margin:16px 0 6px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:rgba(212,175,55,.10);border:1px solid rgba(212,175,55,.45);color:#EBD9B4;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px}
.seg button.on{background:#B7950B;color:#23160A;border-color:#D4AF37;font-weight:700}
.hint{color:#8d8570;font-size:12px;margin-top:4px}
.card{position:relative;width:340px;height:600px;border-radius:16px;overflow:hidden;border:1px solid rgba(212,175,55,.75);background:#221a12}
.card .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,30,54,.34),rgba(74,21,21,.30))}
.x{position:absolute;top:9px;right:11px;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:rgba(0,0,0,.28);border:1px solid rgba(212,175,55,.45);color:#E8D9A8;font-size:13px}
.ttl{position:absolute;top:26px;left:0;right:0;text-align:center;font-size:22px;font-weight:700;letter-spacing:3px;color:#FFE9A8;text-shadow:0 2px 7px rgba(241,196,15,.5)}
.num{position:absolute;left:0;right:0;text-align:center;font-size:27px;font-weight:700;color:#FFD98A;text-shadow:0 2px 8px rgba(241,196,15,.45)}
.sub{position:absolute;left:0;right:0;text-align:center;font-size:12px;color:#C9BFA8}
.lamp{position:absolute;left:50%;transform:translateX(-50%);transform-origin:50% 100%}
.flame{position:absolute;left:50%;transform:translateX(-50%);filter:drop-shadow(0 0 6px rgba(255,190,90,.55))}
.altar{position:absolute;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.75),transparent)}
.sec{position:absolute;left:26px;right:26px;font-size:12px;color:#9C8F6E;letter-spacing:2px}
.row{position:absolute;left:26px;right:26px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#F0E6D2}
.dot{width:8px;height:8px;border-radius:50%;background:#FFD98A;box-shadow:0 0 6px rgba(255,217,138,.6);margin-right:8px}
.row b{color:#FFD98A}
.acts{position:absolute;left:20px;right:20px;bottom:16px}
.cta{width:100%;padding:11px 0;border-radius:999px;text-align:center;font-size:14px;font-weight:700;color:#3A1B0A;background:linear-gradient(180deg,#F1C40F,#B7950B);border:none}
</style>
<div class="wrap">
<div class="ctrl">
  <h3>跳窗名</h3><div class="seg" id="g-name"></div>
  <div class="hint">万家灯火 = 现状</div>

</div>

var CARD_H=600, BASE=0.52, SHIFT=0;   // SHIFT: 灯体内容在 bbox 偏右的补偿(-px)
var S={name:0,tone:1,size:0,fire:0,line:1};
var NAMES=['祈福之光','世界和平之光','和平灯火','为世界和平祈福','万家灯火（现状）'];
var TONES=['原图（现状）','A 轻压','B 中压','C 重压'];
var SIZES=[['30%（缩小70%）',0.30],['70%（缩小30%）',0.70]];
var FIRES=['静态（未点亮）','动态（已点亮）'];
var LINES=['隐藏','显示'];
function seg(id,i,labels,cb){var e=document.getElementById(id);e.innerHTML='';
 labels.forEach(function(t,k){var b=document.createElement('button');b.textContent=t;
  if(S[i]===k)b.className='on';b.onclick=function(){S[i]=k;render();cb&&cb()};e.appendChild(b);});}
function render(){
 seg('g-name','name',NAMES);seg('g-tone','tone',TONES);seg('g-size','size',SIZES.map(function(x){return x[0]}));
 seg('g-fire','fire',FIRES);seg('g-line','line',LINES);
 var f=SIZES[S.size][1], h=424*f*0.548, w=h*AR;   // 424rpx 现状灯高；340px 卡≈620rpx
 var baseY=CARD_H*BASE;
 document.getElementById('ttl').textContent=NAMES[S.name];
 var lamp=document.getElementById('lamp');
 lamp.src=LAMPS[TONES[S.tone]];lamp.style.height=h+'px';lamp.style.width=w+'px';
 lamp.style.top=(baseY-h)+'px';lamp.style.marginLeft=(SHIFT*h/127)+'px';
 var num=document.getElementById('num');
 num.style.top=(baseY-h/2-14)+'px';num.innerHTML='12.85<span style="font-size:13px;font-weight:400;color:#C9BFA8;margin-left:4px">万盏</span>';
 var sub=document.getElementById('sub');sub.style.top=(baseY+10)+'px';
 sub.textContent='今日全国共点亮 128,456 盏灯';
 var fl=document.getElementById('flame');
 if(S.fire===1){fl.style.display='block';fl.src=FLAME;fl.style.height=(h*0.42)+'px';
   fl.style.width=(h*0.42*0.58)+'px';fl.style.top=(baseY-h-h*0.40)+'px';
   fl.style.animation='dance 1.13s ease-in-out infinite';fl.style.transformOrigin='50% 96%';}
 else {fl.style.display='none';}
 document.getElementById('altar').style.top=baseY+'px';
 document.getElementById('altar').style.display=S.line?'block':'none';
}
render();
</script>
